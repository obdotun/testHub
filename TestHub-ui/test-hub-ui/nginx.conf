server {
    listen 80;
    server_name _;

    # Fichiers statiques React
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript;

    # ── API Backend ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts longs pour les runs Robot Framework
        proxy_read_timeout  600s;
        proxy_send_timeout  600s;
        proxy_connect_timeout 30s;
    }

    # ── WebSocket STOMP ───────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;  # 1h — garder le WS ouvert
    }

    # ── Health check Nginx ────────────────────────────────────────────────────
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── React Router — toujours servir index.html ─────────────────────────────
    # Permet la navigation côté client (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques (JS, CSS, images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}