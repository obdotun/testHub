version: '3.9'

services:

  postgres:
    image: postgres:16-alpine
    container_name: testhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       testhub
      POSTGRES_USER:     ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testhub_secret}
      PGDATA:            /var/lib/postgresql/data/pgdata
    volumes:
      - testhub-pgdata:/var/lib/postgresql/data
    networks:
      - testhub-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testhub} -d testhub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./TestHub-backend/TestHub
      dockerfile: Dockerfile
    container_name: testhub-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: "-Xmx512m -Xms256m"
      POSTGRES_USER:      ${POSTGRES_USER:-testhub}
      POSTGRES_PASSWORD:  ${POSTGRES_PASSWORD:-testhub_secret}
      TESTHUB_JWT_SECRET: ${TESTHUB_JWT_SECRET:-TestHub@SecretKey#Docker$$WebbFontaine!CI2026}
    volumes:
      - testhub-projects:/app/storage/projects
      - testhub-reports:/app/storage/reports
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - testhub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./TestHub-ui/test-hub-ui
      dockerfile: Dockerfile
    container_name: testhub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - testhub-net

volumes:
  testhub-pgdata:
    driver: local
  testhub-projects:
    driver: local
  testhub-reports:
    driver: local

networks:
  testhub-net:
    driver: bridge